services:
  partner:
    image: ${ADAPTER_IMAGE:?Set an immutable image tag or digest}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:${HEALTH_PORT:-19083}:8080"
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ../config:/config:ro
      - ../policy:/policy:ro
      - ../credentials:/run/secrets:ro
      - ../state:/state
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
