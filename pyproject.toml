[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyi-acps-adapter"
version = "0.1.0"
description = "Isolated ACPs Group Partner runtime with configurable business connectors"
requires-python = ">=3.12"
dependencies = [
  "acps-sdk==2.1.0", "aio-pika==10.0.1", "httpx==0.28.1",
  "pydantic==2.13.4", "jsonschema>=4.23,<5", "cryptography>=43,<47",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.scripts]
xiaoyi-adapter = "xiaoyi_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
